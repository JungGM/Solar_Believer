name: solar-believer

x-python: &python
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: runtime
  init: true
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    MODEL_ARTIFACT_DIR: /artifacts
  volumes:
    - model_artifacts:/artifacts

x-collector: &collector
  <<: *python
  depends_on:
    migrate:
      condition: service_completed_successfully
  volumes:
    - ./data:/app/data
  stop_grace_period: 90s
  restart: unless-stopped

services:
  db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solar_believer}
      POSTGRES_USER: ${POSTGRES_USER:-solar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *python
    command: [alembic, -c, backend/alembic.ini, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *python
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MODEL_ARTIFACT_DIR: /artifacts
      SOLAR_ASSET_DATA_DIR: /app/data
    volumes:
      - model_artifacts:/artifacts
      - ./data:/app/data:ro
    restart: unless-stopped
    command: [uvicorn, backend.app.main:app, --host, 0.0.0.0, --port, "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    <<: *python
    command: [python, -m, backend.app.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web-publish:
    <<: *python
    command: [python, -m, backend.app.publish_web]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
      web-publish:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 10s
      timeout: 3s
      retries: 6

  collector:
    <<: *collector
    profiles: [collector]
    command: [python, api.py, --continuous]

  open-meteo-collector:
    <<: *collector
    profiles: [collector]
    command: [python, -m, scripts.collect_open_meteo]

  kma-collector:
    <<: *collector
    profiles: [kma]
    command: [python, api.py, --kma-hub, --forecast-only]

  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      RUN_POSTGRES_TESTS: "1"
      DATA_GO_KR_API_KEY: ""
      KMA_APIHUB_KEY: ""
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  model_artifacts:
